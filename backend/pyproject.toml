[project]
name = "dashcam-backend"
version = "0.1.0"
description = "FastAPI + Postgres backend: video upload, background processing, driving report, hazard map"
requires-python = ">=3.11,<3.14"
dependencies = [
    # events.json v1 models live in perception (core deps only: numpy, pydantic, pyyaml).
    # The worker runs the full pipeline in a subprocess, so torch/opencv are NOT backend deps.
    "dashcam-perception",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",  # FastAPI file uploads
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.12.5",          # same pin as perception
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",  # FastAPI TestClient
]

[tool.uv.sources]
dashcam-perception = { path = "../perception", editable = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic", "dashcam_perception"]
