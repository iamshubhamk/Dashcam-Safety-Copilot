# ByteTrack settings (Ultralytics format). Copied from Ultralytics' default bytetrack.yaml,
# with a longer track_buffer so ids survive short occlusions (a bike passing in front).
# ByteTrack's trick: match high-confidence boxes first, then use LOW-confidence boxes to
# continue existing tracks, which keeps a blurry or half-hidden vehicle tracked.
tracker_type: bytetrack
track_high_thresh: 0.25   # first-pass association threshold
track_low_thresh: 0.1     # second-pass (low-score boxes can extend existing tracks)
new_track_thresh: 0.25    # minimum score to start a new track
track_buffer: 45          # frames a lost track is kept (1.5 s at 30 fps); default is 30
match_thresh: 0.8         # IoU-based matching threshold
fuse_score: true          # combine IoU with detection score when matching
