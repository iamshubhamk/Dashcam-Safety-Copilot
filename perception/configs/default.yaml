# Perception pipeline config. Every threshold the alert logic uses lives here,
# so tuning never needs a code change. Loaded and validated by dashcam_perception/config.py.
#
# Design bias (decided with Shubham, 2026-11-02): never miss a real risk; a few false
# alarms are acceptable. So thresholds are generous and confirmation is short.

detector:
  # Any Ultralytics model. The stock COCO model works before our fine-tuned one exists;
  # COCO labels are mapped to our classes with ml/configs/coco_map.yaml.
  # Swap in weights/best.pt (trained in ml/) and the class names are read from the model.
  weights: yolo26s.pt
  coco_map: ml/configs/coco_map.yaml
  classes_file: configs/classes.yaml
  # Low detection threshold on purpose: ByteTrack also uses low-confidence boxes to keep
  # tracks alive through blur/occlusion, and missing an object is worse than an extra box.
  conf: 0.10
  iou: 0.5
  imgsz: 640
  device: null          # null = auto (GPU if available, else CPU); or "cpu", "0"
  # COCO detects a motorbike rider as a separate "person". A person box that sits mostly
  # inside a two-wheeler box is the rider, not a pedestrian, so it is dropped.
  suppress_riders: true
  rider_overlap: 0.5    # fraction of the person box's area inside the two-wheeler box

tracker:
  # ByteTrack (Ultralytics implementation). track_buffer = frames a lost track is kept
  # before its id is retired; higher keeps ids stable through short occlusions.
  config: perception/configs/bytetrack.yaml

camera:
  # We don't know the camera yet, so these are typical phone/dashcam values.
  # They only affect DISTANCE (metres), which is labelled approximate. TTC doesn't use them.
  horizontal_fov_deg: 70.0  # typical phone main camera in landscape video
  mount_height_m: 1.3       # windshield height of a car; use ~2.2 for a truck or bus
  horizon_y_frac: 0.5       # horizon row as a fraction of frame height (0.5 = camera level)

ego_lane:
  # Trapezoid in front of the vehicle, as fractions of frame width/height, listed
  # bottom-left, top-left, top-right, bottom-right. Only objects whose bottom edge
  # overlaps this area can trigger forward-collision / obstacle alerts.
  # The top edge sits just below the horizon so the lane reaches ~80 m ahead with the
  # default camera: at 80 km/h a 4 s warning starts ~90 m out, so a short lane would
  # silently miss the earliest warnings. (A top edge at 0.55 only reached ~23 m.)
  polygon:
    - [0.15, 1.00]
    - [0.47, 0.52]
    - [0.53, 0.52]
    - [0.85, 1.00]
  # Fraction of the object's bottom edge that must lie inside the lane. Low = more recall
  # (a car half in our lane, cutting in, still counts).
  min_overlap: 0.2

ttc:
  # TTC comes from how fast a box grows: d(ln size)/dt = 1/TTC for constant closing speed.
  window_s: 0.6         # fit over this much recent history
  min_samples: 4        # fewer points than this -> no TTC yet
  max_gap_s: 0.5        # history older than this gap is discarded (track was lost)

alerts:
  # Each alert type creates one event per "episode": it opens when the condition is
  # confirmed, keeps the worst severity seen, and closes after `episode_gap_s` without it.
  confirm_hits: 2       # condition must hold in this many of ...
  confirm_window: 3     # ... the last N frames of that track (short = fast, recall-biased)
  episode_gap_s: 1.0

  forward_collision:
    enabled: true
    classes: [car, bus, truck, two_wheeler, auto_rickshaw, pedestrian, animal]
    ttc_warning_s: 4.0
    ttc_critical_s: 2.0
    # Closing in AND closer than this -> critical even if TTC is noisy.
    critical_distance_m: 5.0
    # Pedestrians/animals in our lane get a warning when this close even if not closing
    # (they can step out unpredictably).
    vulnerable_classes: [pedestrian, animal]
    vulnerable_distance_m: 15.0

  obstacle_in_lane:
    enabled: true
    # The COCO model can't see these, so this alert only fires with the fine-tuned model.
    classes: [pothole, barricade, speed_breaker, debris]
    warning_distance_m: 30.0
    critical_distance_m: 12.0

  # Both need our own speed (GPS or OBD), which doesn't exist yet. Enabling them is
  # rejected by config validation until a speed source is wired in.
  tailgating:
    enabled: false
  lead_vehicle_braking:
    enabled: false

output:
  annotated_video: true
  clips: true
  clip_pre_s: 5.0
  clip_post_s: 5.0
