server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads: the API allows up to 2 GB per video (backend/app/config.py).
    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;   # stream big uploads instead of spooling them in nginx
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Single-page app: unknown paths fall back to index.html for the client-side router.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
